<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="vfOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8533"/>
      <stop offset="50%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#ff6b00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Badge Background with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#vfBg)" stroke="#ff6b00" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Subtle Radial Inner Glow -->
  <circle cx="32" cy="32" r="18" fill="#ff6b00" opacity="0.12"/>

  <!-- Vishal Fitness Official Dumbbell Logo -->
  <g transform="translate(13.6, 13.6) scale(1.53)" filter="url(#glow)">
    <path d="m6.5 6.5 11 11" stroke="url(#vfOrange)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m21 21-1-1" stroke="url(#vfOrange)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m3 3 1 1" stroke="url(#vfOrange)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m18 22 4-4" stroke="url(#vfOrange)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m2 6 4-4" stroke="url(#vfOrange)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m3 10 7-7" stroke="url(#vfOrange)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m14 21 7-7" stroke="url(#vfOrange)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
